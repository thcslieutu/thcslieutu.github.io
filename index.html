<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý vi phạm học sinh</title>
  <meta name="theme-color" content="#0f5f78">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230f5f78'/%3E%3Cpath d='M7 12.5l3 3 7-7' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Màn hình đăng nhập -->
  <section id="man-dang-nhap" class="login hidden">
    <form id="f-dang-nhap" class="card login-card" autocomplete="on">
      <div class="logo">✓</div>
      <h1>Quản lý vi phạm học sinh</h1>
      <p class="muted center" id="ten-truong-login"></p>
      <p class="ok-msg center hidden" id="login-ok"></p>
      <label class="dk hidden">Họ và tên<input class="input" name="ten" autocomplete="name"></label>
      <label>Email<input class="input" type="email" name="email" required autocomplete="username"></label>
      <label>Mật khẩu<input class="input" type="password" name="pw" required minlength="6" autocomplete="current-password"></label>
      <button class="btn primary big" type="submit" id="btn-login">Đăng nhập</button>
      <p class="small center"><a href="#" id="lnk-dk">Chưa có tài khoản? Đăng ký</a></p>
      <p class="err center" id="login-err"></p>
    </form>
  </section>

  <!-- Khung ứng dụng -->
  <div id="khung" class="hidden">
    <header class="topbar">
      <div class="brand">
        <b id="ten-truong"></b>
        <small>Quản lý vi phạm học sinh</small>
      </div>
      <nav id="nav"></nav>
      <div class="user">
        <span id="ten-user"></span>
        <button class="btn sm" id="btn-dang-xuat" title="Đăng xuất">Thoát</button>
      </div>
    </header>
    <main id="noi-dung"></main>
  </div>

  <!-- Thông tin tác giả: chỉ hiện trên màn hình máy tính -->
  <footer class="tac-gia" id="tac-gia">
    Tác giả: <b>Lâm Hòa Văn</b> · SĐT: <a href="tel:0977364202">0977.364.202</a> · Giáo viên Trường THCS Liêu Tú
  </footer>

  <div id="modal" class="modal hidden"><div class="modal-box" role="dialog" aria-modal="true"><div id="modal-body"></div></div></div>
  <div id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
