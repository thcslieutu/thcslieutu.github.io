<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ứng dụng quản lý nhà trường</title>
  <meta name="theme-color" content="#0f5f78">
  <link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230f5f78'/%3E%3Cpath d='M7 12.5l3 3 7-7' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <!-- Giao diện: nền tảng + từng phân hệ -->
  <link rel="stylesheet" href="css/nen-tang.css">
  <link rel="stylesheet" href="css/mo-dun/vi-pham.css">
  <link rel="stylesheet" href="css/mo-dun/bao-cao.css">
  <link rel="stylesheet" href="css/mo-dun/so-truc.css">
</head>
<body>
  <!-- Màn hình đăng nhập -->
  <section id="man-dang-nhap" class="login hidden">
    <form id="f-dang-nhap" class="card login-card" autocomplete="on">
      <div class="logo" id="logo-dang-nhap">✓</div>
      <h1 class="ten-ung-dung">Ứng dụng quản lý nhà trường</h1>
      <p class="muted center" id="ten-truong-login"></p>
      <p class="ok-msg center hidden" id="login-ok"></p>
      <label class="dk hidden">Họ và tên<input class="input" name="ten" autocomplete="name"></label>
      <label>Email<input class="input" type="email" name="email" required autocomplete="username"></label>
      <label id="o-mk">Mật khẩu<input class="input" type="password" name="pw" required minlength="6" autocomplete="current-password"></label>
      <button class="btn primary big" type="submit" id="btn-login">Đăng nhập</button>
      <p class="small center lien-ket"><a href="#" id="lnk-quen">Quên mật khẩu?</a><a href="#" id="lnk-dk">Chưa có tài khoản? Đăng ký</a></p>
      <p class="err center" id="login-err"></p>
    </form>
  </section>

  <!-- Đặt mật khẩu mới (mở từ liên kết "Quên mật khẩu" trong email) -->
  <section id="man-dat-mk" class="login hidden">
    <form id="f-dat-mk" class="card login-card" autocomplete="off">
      <div class="logo">🔑</div>
      <h1>Đặt mật khẩu mới</h1>
      <p class="muted center small" id="dat-mk-email"></p>
      <label>Mật khẩu mới<input class="input" type="password" name="moi" required minlength="8" autocomplete="new-password"></label>
      <label>Nhập lại mật khẩu mới<input class="input" type="password" name="lai" required minlength="8" autocomplete="new-password"></label>
      <p class="muted small">Ít nhất 8 ký tự, nên có cả chữ và số.</p>
      <button class="btn primary big" type="submit" id="btn-dat-mk">Lưu mật khẩu mới</button>
      <p class="small center"><a href="#" id="lnk-huy-dat-mk">Hủy</a></p>
      <p class="err center" id="dat-mk-err"></p>
    </form>
  </section>

  <!-- Khung ứng dụng -->
  <div id="khung" class="hidden">
    <header class="topbar">
      <img id="logo-nho" class="logo-nho hidden" alt="">
      <div class="brand">
        <b id="ten-truong"></b>
        <small id="ten-phan-he"></small>
      </div>
      <nav id="nav"></nav>
      <div class="user">
        <span id="ten-user"></span>
        <button class="btn sm" id="btn-chup" title="Chụp toàn bộ trang thành ảnh PNG">📷<span class="nhan-nut"> Chụp ảnh</span></button>
        <button class="btn sm" id="btn-in" title="Lưu trang thành PDF hoặc in">🖨️<span class="nhan-nut"> PDF / In</span></button>
        <button class="btn sm" id="btn-doi-mk" title="Đổi mật khẩu">Mật khẩu</button>
        <button class="btn sm" id="btn-dang-xuat" title="Đăng xuất">Thoát</button>
      </div>
    </header>
    <div id="in-dau" class="chi-in"></div>
    <main id="noi-dung"></main>
  </div>

  <!-- Thông tin tác giả: lấy từ js/config.js (TAC_GIA…), chỉ hiện trên màn hình máy tính -->
  <footer class="tac-gia hidden" id="tac-gia"></footer>

  <div id="modal" class="modal hidden"><div class="modal-box" role="dialog" aria-modal="true"><div id="modal-body"></div></div></div>
  <div id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/config.js"></script>

  <!-- NỀN TẢNG (bắt buộc, giữ đúng thứ tự) -->
  <script src="js/nen-tang/tien-ich.js"></script>
  <script src="js/nen-tang/giao-dien.js"></script>
  <script src="js/nen-tang/ung-dung.js"></script>

  <!-- CÁC PHÂN HỆ: thêm phân hệ mới = thêm các dòng <script> của phân hệ đó vào đây.
       Bỏ một phân hệ = xóa các dòng của phân hệ đó. -->
  <!-- Phân hệ Vi phạm -->
  <script src="js/mo-dun/vi-pham/chung.js"></script>
  <script src="js/mo-dun/vi-pham/nhap.js"></script>
  <script src="js/mo-dun/vi-pham/xu-ly.js"></script>
  <script src="js/mo-dun/vi-pham/thong-ke.js"></script>
  <script src="js/mo-dun/vi-pham/danh-muc.js"></script>
  <script src="js/mo-dun/vi-pham/phan-he.js"></script>
  <!-- Phân hệ Chuyên cần (cần phân hệ Vi phạm) -->
  <script src="js/mo-dun/chuyen-can/bao-cao.js"></script>
  <script src="js/mo-dun/chuyen-can/phan-he.js"></script>
  <!-- Phân hệ Báo cáo -->
  <script src="js/mo-dun/bao-cao/tep.js"></script>
  <script src="js/mo-dun/bao-cao/bao-cao.js"></script>
  <script src="js/mo-dun/bao-cao/phan-he.js"></script>

  <script src="js/mo-dun/so-truc/so-truc.js"></script>
  <script src="js/mo-dun/so-truc/phan-he.js"></script>
  <!-- Phân hệ Quản trị -->
  <script src="js/mo-dun/quan-tri/hoc-sinh.js"></script>
  <script src="js/mo-dun/quan-tri/tai-khoan.js"></script>
  <script src="js/mo-dun/quan-tri/cau-hinh.js"></script>
  <script src="js/mo-dun/quan-tri/du-lieu.js"></script>
  <script src="js/mo-dun/quan-tri/phan-he.js"></script>

  <!-- Khởi động (luôn để cuối cùng) -->
  <script src="js/khoi-dong.js"></script>
</body>
</html>
